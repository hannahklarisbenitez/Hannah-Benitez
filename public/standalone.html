    // --- Web Audio Queue Chime (Realistic 2-tone airport / service chime) ---
    const playQueueChime = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now); // D5
        osc1.frequency.setValueAtTime(880.00, now + 0.18); // A5

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(587.33, now);
        osc2.frequency.setValueAtTime(880.00, now + 0.18);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.25, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.95);
        osc2.stop(now + 0.95);
      } catch (err) {
        console.warn('Audio chime notice:', err);
      }
    };

                <div className="flex items-center justify-between">
                  <div>
                    <h1 className="text-2xl font-black text-slate-900">Admin Control Hub</h1>
                    <p className="text-xs text-slate-500">Financial audits, staff rosters, and service catalog management.</p>
                  </div>
                  <span className="px-3 py-1 bg-[#CB0404]/10 text-[#CB0404] font-bold font-mono text-xs rounded-xl border border-[#CB0404]/20">
                    Administrator Mode
                  </span>
                </div>

                {/* KPI Metrics */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[11px] text-slate-500 font-bold uppercase block">Today's Revenue</span>
                    <span className="text-2xl font-black text-slate-900 font-mono mt-1 block">₱2,110.00</span>
                    <span className="text-[10px] text-emerald-600 font-bold">↑ 18% vs yesterday</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[11px] text-slate-500 font-bold uppercase block">Completed Orders</span>
                    <span className="text-2xl font-black text-slate-900 font-mono mt-1 block">48</span>
                    <span className="text-[10px] text-slate-400">Ground floor shop</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[11px] text-slate-500 font-bold uppercase block">Avg Turnaround</span>
                    <span className="text-2xl font-black text-[#309898] font-mono mt-1 block">14 mins</span>
                    <span className="text-[10px] text-emerald-600 font-bold">FastQueue target met</span>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[11px] text-slate-500 font-bold uppercase block">Active Staff</span>
                    <span className="text-2xl font-black text-slate-900 font-mono mt-1 block">5 / 5</span>
                    <span className="text-[10px] text-slate-400">All shifts covered</span>
                  </div>
                </div>

                {/* Team Roster */}
                <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
                  <h3 className="font-extrabold text-sm text-slate-900">Authorized Team Members</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-xs">
                    {[
                      { name: 'Hannah Benitez', role: 'ADMIN', user: 'benitez' },
                      { name: 'John Bonda', role: 'STAFF', user: 'bonda' },
                      { name: 'Maria Cometa', role: 'STAFF', user: 'cometa' },
                      { name: 'Rafael Laserna', role: 'STAFF', user: 'laserna' },
                      { name: 'Grace Porosa', role: 'STAFF', user: 'porosa' }
                    ].map((m, idx) => (
                      <div key={idx} className="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                        <div>
                          <div className="font-bold text-slate-900">{m.name}</div>
                          <div className="text-[10px] font-mono text-slate-500">@{m.user}</div>
                        </div>
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${m.role === 'ADMIN' ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800'}`}>
                          {m.role}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* GLOBAL FOOTER */}
          {activePortal !== 'tv' && (
            <footer className="bg-[#242B33] text-white/70 text-xs py-8 border-t border-white/10 mt-auto">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
                <Logo size="md" variant="dark" />
                <p className="text-[11px] text-slate-400">
                  © 2026 Quick Print Hub • Ground Floor, Student Plaza Commercial Complex
                </p>
              </div>
            </footer>
          )}

          {/* CONFIGURATOR ORDER MODAL */}
          {configuringService && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl relative border border-slate-100 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                  <div>
                    <span className="text-[10px] font-mono font-bold uppercase text-[#309898] bg-[#309898]/10 px-2 py-0.5 rounded">
                      {configuringService.code}
                    </span>
                    <h3 className="font-extrabold text-base text-slate-900 mt-1">{configuringService.name}</h3>
                  </div>
                  <button onClick={() => setConfiguringService(null)} className="text-slate-400 hover:text-slate-600 p-1">✕</button>
                </div>

                <form onSubmit={handlePlaceOrder} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Your Full Name *</label>
                      <input 
                        type="text" 
                        required 
                        value={customerName} 
                        onChange={e => setCustomerName(e.target.value)} 
                        placeholder="e.g. Juan dela Cruz" 
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#309898] outline-none" 
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Contact / Mobile *</label>
                      <input 
                        type="text" 
                        required 
                        value={contactNumber} 
                        onChange={e => setContactNumber(e.target.value)} 
                        placeholder="0917-000-0000" 
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#309898] outline-none" 
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Paper Size</label>
                      <select 
                        value={paperSize} 
                        onChange={e => setPaperSize(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white"
                      >
                        <option value="short">Short / Letter (8.5 x 11")</option>
                        <option value="a4">A4 (8.27 x 11.69")</option>
                        <option value="long">Long / Legal (8.5 x 13")</option>
                        <option value="a3">A3 (11.7 x 16.5") (+₱1.50)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Paper Material</label>
                      <select 
                        value={paperType} 
                        onChange={e => setPaperType(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white"
                      >
                        <option value="regular70">70gsm Standard Copier</option>
                        <option value="book80">80gsm Book Paper</option>
                        <option value="glossyPhoto">Glossy Photo 230gsm</option>
                        <option value="stickerVinyl">Waterproof Vinyl Decal</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Sides</label>
                      <select 
                        value={printSide} 
                        onChange={e => setPrintSide(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white"
                      >
                        <option value="single">Single Sided</option>
                        <option value="double">Back-to-Back (Duplex)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Pages</label>
                      <input 
                        type="number" 
                        min="1" 
                        value={pageCount} 
                        onChange={e => setPageCount(Math.max(1, parseInt(e.target.value) || 1))} 
                        className="w-full px-3 py-2 rounded-xl border border-slate-300"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Copies</label>
                      <input 
                        type="number" 
                        min="1" 
                        value={copiesCount} 
                        onChange={e => setCopiesCount(Math.max(1, parseInt(e.target.value) || 1))} 
                        className="w-full px-3 py-2 rounded-xl border border-slate-300"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Binding & Finish</label>
                    <select 
                      value={binding} 
                      onChange={e => setBinding(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white"
                    >
                      <option value="none">No Binding (Loose Sheets)</option>
                      <option value="staple">Corner Staple (+₱5)</option>
                      <option value="ring">Spiral Ring Coil (+₱35)</option>
                      <option value="hard">Hardbound Gold Foil (+₱250)</option>
                    </select>
                  </div>

                  {/* Calculated Price Box */}
                  <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-slate-400 block uppercase font-bold">Estimated Cost</span>
                      <span className="text-2xl font-black text-[#F4631E] font-mono">
                        ₱{calculatedPrice.toFixed(2)}
                      </span>
                    </div>
                    <span className="text-[11px] font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-lg">
                      Turnaround: {configuringService.turnaround}
                    </span>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button 
                      type="button" 
                      onClick={() => setConfiguringService(null)}
                      className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="px-6 py-2.5 rounded-xl bg-[#F4631E] hover:bg-[#e05312] text-white font-bold shadow-md transition-all flex items-center gap-1.5"
                    >
                      <Icons.Printer className="w-4 h-4" />
                      <span>Generate Ticket & Place Order</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* THERMAL CLAIM TICKET MODAL */}
          {ticketModalOrder && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative border border-slate-100">
                <button 
                  onClick={() => setTicketModalOrder(null)} 
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"
                >
                  ✕
                </button>

                {/* Printable Ticket Receipt Area */}
                <div id="printable-ticket" className="bg-[#FAF9F5] p-5 rounded-xl border border-dashed border-slate-300 font-mono text-center space-y-3">
                  <div className="text-[11px] text-slate-400 font-sans font-bold uppercase tracking-widest">Official Claim Slip</div>
                  
                  <div className="font-sans font-black text-xl text-slate-900">
                    Quick Print <span className="text-[#F4631E]">Hub</span>
                  </div>
                  <div className="text-[10px] text-slate-500">Student Plaza Commercial Complex</div>

                  <div className="py-3 border-y border-dashed border-slate-300 my-2">
                    <div className="text-[11px] text-slate-400 uppercase">Queue Number</div>
                    <div className="text-4xl font-black text-[#F4631E] tracking-tight">{ticketModalOrder.queueNumber}</div>
                    <div className="text-[11px] text-slate-600 font-bold mt-1">{ticketModalOrder.trackingCode}</div>
                  </div>

                  <div className="text-left text-xs space-y-1 py-1">
                    <div className="flex justify-between">
                      <span className="text-slate-500">Customer:</span>
                      <span className="font-bold text-slate-800">{ticketModalOrder.customerName}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Service:</span>
                      <span className="font-bold text-slate-800">{ticketModalOrder.serviceName}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Total:</span>
                      <span className="font-black text-slate-900">₱{ticketModalOrder.totalAmount.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Payment:</span>
                      <span className="font-bold text-slate-700">{ticketModalOrder.paymentStatus}</span>
                    </div>
                  </div>

                  {/* Simulated barcode */}
                  <div className="pt-2 text-[9px] text-slate-400 tracking-widest">
                    ||| | |||| || | ||||| |||| | |||
                  </div>
                  <div className="text-[9px] text-slate-400">Please present this slip at Counter 1</div>
                </div>

                <div className="mt-4 flex gap-2">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 py-2.5 rounded-xl bg-[#242B33] hover:bg-slate-800 text-white font-bold text-xs shadow transition-all flex items-center justify-center gap-1.5"
                  >
                    <Icons.Printer className="w-4 h-4" />
                    <span>Print Slip</span>
                  </button>
                  <button
                    onClick={() => setTicketModalOrder(null)}
                    className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render into root element
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
